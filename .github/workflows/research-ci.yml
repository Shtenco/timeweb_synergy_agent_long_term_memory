name: HIAI article 13 tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q prototypes experiments tests
      - name: SQLite fixture smoke
        run: python experiments/sqlite_cross_session.py --out results/local/ci.json
      - name: Check required docs
        run: |
          python - <<'PYCI'
          from pathlib import Path
          for n in ['README.md','LICENSE','CITATION.cff','docs/RUNBOOK.md','docs/EVIDENCE_SCOPE.md','docs/PROVENANCE.md','docs/TIMEWEB_STATUS.md']:
              assert Path(n).is_file(),n
          PYCI
